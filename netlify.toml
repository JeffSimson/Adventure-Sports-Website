[build]
  publish = "."
  command = ""


[build.environment]
  # Firebase browser API keys are public identifiers used by the web client.
  # Netlify Smart Detection otherwise blocks the deploy when it sees the AIza value.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCJ2bzP2XdpSvbqdr4eg5ALHcQUBAFXQ1E"

[functions]
  directory = "netlify/functions"


[[headers]]
  for = "/.netlify/functions/live-content"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/ops/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
