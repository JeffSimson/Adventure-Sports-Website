# Operations Hub keeps the strict CSP (no unsafe-eval).
[[headers]]
  for = "/ops/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://identity.netlify.com https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://identity.netlify.com https://api.resend.com https://fcm.googleapis.com https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self' https://embed.windy.com https://www.windy.com; upgrade-insecure-requests"

# Decap CMS requires JavaScript evaluation internally. Restrict unsafe-eval to
# the admin path only while keeping frame/object protections and explicit CDNs.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://identity.netlify.com https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data: https:; worker-src 'self' blob:; frame-src 'self' https:; upgrade-insecure-requests"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/ops/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Automatic operations checks run every five minutes.
[functions."auto-operations-alerts"]
  schedule = "*/5 * * * *"

# Always expose the newest installed-app build marker.
[[headers]]
  for = "/ops/build.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/launch-settings"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

