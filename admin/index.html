<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Adventure Sports Website Editor</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0b2345;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#071d3b 0,#0f3968 100%)}
    #cmsBoot{min-height:100vh;display:grid;place-items:center;padding:24px}
    .boot-card{width:min(560px,100%);background:#fff;border-radius:24px;padding:34px;box-shadow:0 24px 80px rgba(0,0,0,.28);text-align:center}
    .boot-logo{width:120px;max-height:90px;object-fit:contain;margin-bottom:14px}.boot-kicker{font-size:12px;letter-spacing:.18em;font-weight:800;color:#0b5dbb;text-transform:uppercase}
    h1{font-size:28px;margin:10px 0 8px}.boot-copy{color:#5b6b82;line-height:1.55;margin:0 auto 20px;max-width:440px}
    .loader{width:34px;height:34px;border:4px solid #dce7f5;border-top-color:#1260bd;border-radius:50%;margin:20px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .boot-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.boot-btn{appearance:none;border:1px solid #c9d8eb;border-radius:12px;padding:11px 16px;font:inherit;font-weight:750;background:#fff;color:#0a4f9c;cursor:pointer;text-decoration:none}.boot-btn.primary{background:#0c5fbd;color:#fff;border-color:#0c5fbd}
    #cmsError{display:none;background:#fff2f0;border:1px solid #ffc7c0;color:#8f1d12;text-align:left;padding:14px;border-radius:14px;margin-top:16px;font-size:14px;line-height:1.45}
    #cmsHint{font-size:13px;color:#718096;margin-top:15px}
    .bulk-link{position:fixed;right:16px;bottom:16px;z-index:10000;background:#173d7a;color:#fff;padding:11px 15px;border-radius:999px;text-decoration:none;font-weight:800;box-shadow:0 10px 28px rgba(0,0,0,.25)}
    @media(max-width:600px){.boot-card{padding:26px 20px;border-radius:20px}.bulk-link{right:12px;bottom:12px}}
  </style>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div id="cmsBoot">
    <div class="boot-card">
      <img class="boot-logo" src="/adventure-logo.png" alt="Adventure Sports" onerror="this.style.display='none'" />
      <div class="boot-kicker">Secure Website Editor</div>
      <h1>Adventure Sports CMS</h1>
      <p class="boot-copy" id="cmsStatus">Loading the website editor…</p>
      <div class="loader" id="cmsLoader"></div>
      <div id="cmsError"></div>
      <div class="boot-actions" id="cmsActions" style="display:none">
        <button class="boot-btn primary" id="retryCms" type="button">Retry Editor</button>
        <a class="boot-btn" href="/admin/events-import.html">Bulk Event Import</a>
        <a class="boot-btn" href="/">View Website</a>
      </div>
      <div id="cmsHint">The editor should open automatically.</div>
    </div>
  </div>
  <a class="bulk-link" href="/admin/events-import.html">Bulk Event Import</a>

  <script>
  (function(){
    const boot = document.getElementById('cmsBoot');
    const status = document.getElementById('cmsStatus');
    const loader = document.getElementById('cmsLoader');
    const error = document.getElementById('cmsError');
    const actions = document.getElementById('cmsActions');
    const retry = document.getElementById('retryCms');
    let finished = false;

    function showError(message){
      if (finished) return;
      loader.style.display = 'none';
      actions.style.display = 'flex';
      status.textContent = 'The editor did not load.';
      error.style.display = 'block';
      error.innerHTML = '<strong>Editor loading problem</strong><br>' + message + '<br><br>If you use Brave, temporarily turn Shields off for adventurenj.com and press Retry Editor.';
    }

    function markLoaded(){
      finished = true;
      boot.style.display = 'none';
    }

    function cmsReady(){
      return !!(window.CMS || window.initCMS || document.querySelector('[class*="AppHeader"], [class*="LoginPage"], [data-testid]'));
    }

    function watchForCms(){
      const started = Date.now();
      const timer = setInterval(function(){
        if (cmsReady()) { clearInterval(timer); markLoaded(); return; }
        if (Date.now() - started > 12000) { clearInterval(timer); showError('Decap CMS was blocked or could not start.'); }
      }, 250);
    }

    function loadScript(src, onSuccess, onFail){
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = onSuccess;
      s.onerror = function(){ s.remove(); onFail && onFail(); };
      document.body.appendChild(s);
    }

    function start(){
      finished = false;
      error.style.display = 'none';
      actions.style.display = 'none';
      loader.style.display = 'block';
      status.textContent = 'Loading the website editor…';

      // jsDelivr is Decap CMS's documented primary CDN. Pinning the version avoids a surprise breaking update.
      loadScript('https://cdn.jsdelivr.net/npm/decap-cms@3.16.3/dist/decap-cms.js', function(){
        status.textContent = 'Starting editor…';
        watchForCms();
      }, function(){
        status.textContent = 'Primary editor source unavailable — trying backup…';
        loadScript('https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js', function(){
          status.textContent = 'Starting editor…';
          watchForCms();
        }, function(){
          showError('Both editor sources were blocked or unavailable.');
        });
      });
    }

    retry.addEventListener('click', function(){ location.reload(); });

    window.addEventListener('error', function(e){
      if (!finished && /decap|cms|script/i.test(String(e.message || ''))) showError('A browser script error stopped the editor.');
    });

    start();
  })();
  </script>
</body>
</html>
