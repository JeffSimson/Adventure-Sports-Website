<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Adventure Sports Admin Diagnostics</title><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><style>body{font-family:system-ui;padding:30px;background:#f5f8fc;color:#10233d}.card{max-width:760px;margin:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 10px 30px #0001}pre{white-space:pre-wrap;background:#071b38;color:#dcecff;padding:16px;border-radius:12px}button{padding:12px 16px;border:0;border-radius:10px;background:#0868c9;color:white;font-weight:800}</style></head><body><div class="card"><h1>Admin Diagnostics</h1><p>This checks the logged-in user and instant-update function.</p><button id="run">Run checks</button><pre id="out">Waiting…</pre></div><script>async function run(){const o=document.getElementById('out');o.textContent='Checking…';const u=window.netlifyIdentity&&window.netlifyIdentity.currentUser?window.netlifyIdentity.currentUser():null;let lines=['Identity user: '+(u?u.email:'NOT SIGNED IN'),'Profile name: '+(u&&u.user_metadata?(u.user_metadata.full_name||u.user_metadata.name||'not set'):'not available')];try{const r=await fetch('/.netlify/functions/live-content?health=1&v='+Date.now(),{cache:'no-store'});lines.push('Live function HTTP: '+r.status);lines.push('Live function response: '+await r.text())}catch(e){lines.push('Live function error: '+e.message)}o.textContent=lines.join('
')}document.getElementById('run').onclick=run;if(window.netlifyIdentity){window.netlifyIdentity.on('init',run)}setTimeout(run,1000)</script></body></html>
